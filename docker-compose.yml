services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stallcall
      POSTGRES_PASSWORD: stallcall
      POSTGRES_DB: stallcall
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stallcall -d stallcall']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
